[project]
name = "paperico-backend"
version = "0.1.0"
description = "Paperico - Paper Reading Workbench Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "cryptography>=44.0",
    "sse-starlette>=2.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
