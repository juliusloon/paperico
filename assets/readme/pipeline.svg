<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Paperico pipeline</title>
  <desc id="pipeline-desc">Five-stage flow: import a PDF with SHA-256 dedup, parse it with MinerU into typed blocks, run one streaming LLM analysis that produces translation, roles and methods, read and ask with evidence citations that jump back to the source, then turn selected answers into Markdown notes.</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="26" fill="#FBFCFD" stroke="#E4E8EE" stroke-width="1.5"/>

  <g id="stage-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- Card 1: Import -->
    <g transform="translate(55 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 01</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">Import</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">drop in a PDF</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">SHA-256 dedup</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">stays local</text>
    </g>
    <!-- Card 2: Parse -->
    <g transform="translate(280 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 02</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">Parse</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">MinerU, cloud</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">or self-hosted</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">typed blocks</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">figures · bbox</text>
    </g>
    <!-- Card 3: Analyze -->
    <g transform="translate(505 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 03</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">Analyze</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">one streaming</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">LLM request:</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">translation·roles</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">methods·TL;DR</text>
    </g>
    <!-- Card 4: Read & ask -->
    <g transform="translate(730 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 04</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">Read &amp; ask</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">logic-chain view</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">citations jump to</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">the exact block</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">or PDF region</text>
    </g>
    <!-- Card 5: Notes -->
    <g transform="translate(955 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 05</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">Notes</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">pick any answers</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">Markdown notes</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">[[wikilinks]], .md</text>
    </g>
  </g>

  <g id="flow-arrows" stroke="#0A72DC" stroke-width="2.5" fill="#0A72DC">
    <line x1="252" y1="160" x2="268" y2="160"/>
    <polygon points="268,153 279,160 268,167" stroke="none"/>
    <line x1="477" y1="160" x2="493" y2="160"/>
    <polygon points="493,153 504,160 493,167" stroke="none"/>
    <line x1="702" y1="160" x2="718" y2="160"/>
    <polygon points="718,153 729,160 718,167" stroke="none"/>
    <line x1="927" y1="160" x2="943" y2="160"/>
    <polygon points="943,153 954,160 943,167" stroke="none"/>
  </g>
</svg>
