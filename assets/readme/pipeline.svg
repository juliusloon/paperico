<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Paperico pipeline</title>
  <desc id="pipeline-desc">Five stages feed one local library: import a PDF with SHA-256 dedup, parse it with MinerU into typed blocks, run streaming LLM analysis that produces translation, roles and methods, translating long papers in bounded batches before a full-paper summary, read and ask with evidence citations that jump back to the source, then turn selected answers into Markdown notes. Everything lands in the sandboxed local library, which an opt-in read-only MCP server exposes to Claude Code, Cursor and VS Code.</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="26" fill="#FBFCFD" stroke="#E4E8EE" stroke-width="1.5"/>

  <g id="stage-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- Card 1: Import -->
    <g transform="translate(55 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 01</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">Import</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">drop in a PDF</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">SHA-256 dedup</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">stays local</text>
    </g>
    <!-- Card 2: Parse -->
    <g transform="translate(280 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 02</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">Parse</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">MinerU, cloud</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">or self-hosted</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">typed blocks</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">figures · bbox</text>
    </g>
    <!-- Card 3: Analyze -->
    <g transform="translate(505 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 03</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">Analyze</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">streaming LLM</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">bounded batches</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">translation·roles</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">methods·TL;DR</text>
    </g>
    <!-- Card 4: Read & ask -->
    <g transform="translate(730 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 04</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">Read &amp; ask</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">logic-chain view</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">citations jump to</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">the exact block</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">or PDF region</text>
    </g>
    <!-- Card 5: Notes -->
    <g transform="translate(955 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 05</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">Notes</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">pick any answers</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">Markdown notes</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">[[wikilinks]], .md</text>
    </g>
  </g>

  <g id="flow-arrows" stroke="#3260CF" stroke-width="2.5" fill="#3260CF">
    <line x1="252" y1="146" x2="268" y2="146"/>
    <polygon points="268,139 279,146 268,153" stroke="none"/>
    <line x1="477" y1="146" x2="493" y2="146"/>
    <polygon points="493,139 504,146 493,153" stroke="none"/>
    <line x1="702" y1="146" x2="718" y2="146"/>
    <polygon points="718,139 729,146 718,153" stroke="none"/>
    <line x1="927" y1="146" x2="943" y2="146"/>
    <polygon points="943,139 954,146 943,153" stroke="none"/>
  </g>

  <!-- Everything lands in the local library; MCP exposes it read-only -->
  <g id="library-band">
    <line x1="600" y1="252" x2="600" y2="282" stroke="#3260CF" stroke-width="2.5"/>
    <polygon points="593,282 607,282 600,293" fill="#3260CF"/>
    <rect x="55" y="296" width="1090" height="60" rx="14" fill="#3260CF" fill-opacity="0.06" stroke="#3260CF" stroke-opacity="0.28" stroke-width="1.5"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">
      <text x="79" y="333" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-weight="600" fill="#3260CF">LOCAL LIBRARY</text>
      <text x="252" y="333" fill="#3E4450">sandbox JSON · opt-in read-only MCP for Agents</text>
    </g>
  </g>
</svg>
