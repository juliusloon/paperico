<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Paperico 处理流程</title>
  <desc id="pipeline-desc">五个阶段汇入同一个本地论文库：导入 PDF 并做 SHA-256 去重；用 MinerU（云端或自托管）解析为类型化分块；流式 LLM 分析生成译文、角色与方法索引，长论文分段翻译后汇总；在逻辑链中精读并按证据引用提问，引用可跳回原文；把选中的回答沉淀为 Markdown 笔记。全部结果落在沙盒本地论文库中，可选开启的只读 MCP 服务让 Claude Code、Cursor 和 VS Code 读取它。</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="26" fill="#FBFCFD" stroke="#E4E8EE" stroke-width="1.5"/>

  <g id="stage-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- Card 1: 导入 -->
    <g transform="translate(55 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 01</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">导入</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">拖入 PDF</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">SHA-256 去重</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">论文留在本机</text>
    </g>
    <!-- Card 2: 解析 -->
    <g transform="translate(280 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 02</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">解析</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">MinerU 云端</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">或自托管</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">类型化分块</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">图表 · bbox</text>
    </g>
    <!-- Card 3: 分析 -->
    <g transform="translate(505 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 03</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">分析</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">长文分段翻译</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">译文 · 要点</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">角色 · 方法</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">TL;DR · 实体</text>
    </g>
    <!-- Card 4: 精读问答 -->
    <g transform="translate(730 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 04</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">精读问答</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">逻辑链大纲</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">引用跳回证据</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">段落或 PDF</text>
      <text x="16" y="166" font-size="18" fill="#3E4450">精确区域</text>
    </g>
    <!-- Card 5: 笔记 -->
    <g transform="translate(955 48)">
      <rect width="190" height="196" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="32" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">STEP 05</text>
      <text x="16" y="62" font-size="21" font-weight="600" fill="#15181E">笔记</text>
      <text x="16" y="94" font-size="18" fill="#3E4450">勾选任意回答</text>
      <text x="16" y="118" font-size="18" fill="#3E4450">Markdown 笔记</text>
      <text x="16" y="142" font-size="18" fill="#3E4450">双链 · 导出 .md</text>
    </g>
  </g>

  <g id="flow-arrows" stroke="#3260CF" stroke-width="2.5" fill="#3260CF">
    <line x1="252" y1="146" x2="268" y2="146"/>
    <polygon points="268,139 279,146 268,153" stroke="none"/>
    <line x1="477" y1="146" x2="493" y2="146"/>
    <polygon points="493,139 504,146 493,153" stroke="none"/>
    <line x1="702" y1="146" x2="718" y2="146"/>
    <polygon points="718,139 729,146 718,153" stroke="none"/>
    <line x1="927" y1="146" x2="943" y2="146"/>
    <polygon points="943,139 954,146 943,153" stroke="none"/>
  </g>

  <!-- 全部结果汇入本地论文库；MCP 以只读方式开放 -->
  <g id="library-band">
    <line x1="600" y1="252" x2="600" y2="282" stroke="#3260CF" stroke-width="2.5"/>
    <polygon points="593,282 607,282 600,293" fill="#3260CF"/>
    <rect x="55" y="296" width="1090" height="60" rx="14" fill="#3260CF" fill-opacity="0.06" stroke="#3260CF" stroke-opacity="0.28" stroke-width="1.5"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">
      <text x="79" y="333" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', 'PingFang SC', monospace" font-size="18" font-weight="600" fill="#3260CF">本地论文库</text>
      <text x="216" y="333" fill="#3E4450">沙盒 JSON · 可选只读 MCP 供 Agent 读取</text>
    </g>
  </g>
</svg>
