<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Paperico 处理流程</title>
  <desc id="pipeline-desc">五个阶段：导入 PDF 并做 SHA-256 去重；用 MinerU（云端或自托管）解析为类型化分块；单次流式 LLM 分析生成译文、角色与方法索引；在逻辑链中精读并按证据引用提问，引用可跳回原文；把选中的回答沉淀为 Markdown 笔记。</desc>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="26" fill="#FBFCFD" stroke="#E4E8EE" stroke-width="1.5"/>

  <g id="stage-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- Card 1: 导入 -->
    <g transform="translate(55 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 01</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">导入</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">拖入 PDF</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">SHA-256 去重</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">论文留在本机</text>
    </g>
    <!-- Card 2: 解析 -->
    <g transform="translate(280 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 02</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">解析</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">MinerU 云端</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">或自托管</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">类型化分块</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">图表 · bbox</text>
    </g>
    <!-- Card 3: 分析 -->
    <g transform="translate(505 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 03</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">分析</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">单次流式请求</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">译文 · 要点</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">角色 · 方法</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">TL;DR · 实体</text>
    </g>
    <!-- Card 4: 精读问答 -->
    <g transform="translate(730 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 04</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">精读问答</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">逻辑链大纲</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">引用跳回证据</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">段落或 PDF</text>
      <text x="16" y="172" font-size="18" fill="#3E4450">精确区域</text>
    </g>
    <!-- Card 5: 笔记 -->
    <g transform="translate(955 60)">
      <rect width="190" height="200" rx="16" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="1.5"/>
      <text x="16" y="34" font-family="ui-monospace, 'SFMono-Regular', 'Menlo', monospace" font-size="18" fill="#0A72DC">STEP 05</text>
      <text x="16" y="66" font-size="21" font-weight="600" fill="#15181E">笔记</text>
      <text x="16" y="100" font-size="18" fill="#3E4450">勾选任意回答</text>
      <text x="16" y="124" font-size="18" fill="#3E4450">Markdown 笔记</text>
      <text x="16" y="148" font-size="18" fill="#3E4450">双链 · 导出 .md</text>
    </g>
  </g>

  <g id="flow-arrows" stroke="#0A72DC" stroke-width="2.5" fill="#0A72DC">
    <line x1="252" y1="160" x2="268" y2="160"/>
    <polygon points="268,153 279,160 268,167" stroke="none"/>
    <line x1="477" y1="160" x2="493" y2="160"/>
    <polygon points="493,153 504,160 493,167" stroke="none"/>
    <line x1="702" y1="160" x2="718" y2="160"/>
    <polygon points="718,153 729,160 718,167" stroke="none"/>
    <line x1="927" y1="160" x2="943" y2="160"/>
    <polygon points="943,153 954,160 943,167" stroke="none"/>
  </g>
</svg>
