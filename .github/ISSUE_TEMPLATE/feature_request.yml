name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve? What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Alternatives you considered are welcome.
    validations:
      required: true
  - type: checkboxes
    id: evidence-rule
    attributes:
      label: Evidence/traceability
      description: Paperico's ground rule is that AI output must be traceable to the source paper. Does your idea fit this model, and if it involves AI output, how should it cite the paper?
      options:
        - label: My idea keeps AI output traceable to the source paper
          required: false
