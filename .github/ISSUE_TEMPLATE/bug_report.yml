name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Web client
        - macOS app
        - Backend only (API)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.2 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Backend console output or browser console errors. Redact API keys — paste them as `****` if they appear.
    validations:
      required: false
