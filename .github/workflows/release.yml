name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    name: macOS DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build DMG
        run: ./macos/scripts/make_dmg.sh CODE_SIGNING_ALLOWED=NO
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          for dmg in macos/build/Paperico-*.dmg; do
            name=$(basename "$dmg")
            if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving already uploaded release artifact: $name"
            else
              gh release upload "${GITHUB_REF_NAME}" "$dmg"
            fi
          done
