name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: macOS DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Developer tool regression tests
        run: python3 -m unittest discover -s macos/scripts/tests -p 'test_*.py'
      - name: Core and MCP regression tests
        run: swift test --package-path macos
      - name: Build DMG
        run: ./macos/scripts/make_dmg.sh CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
          for artifact in macos/build/Paperico-*.dmg macos/build/Paperico-*.dmg.sha256; do
            name=$(basename "$artifact")
            if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Preserving already uploaded release artifact: $name"
            else
              gh release upload "${GITHUB_REF_NAME}" "$artifact"
            fi
          done
