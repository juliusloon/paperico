name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for obvious credential patterns
        run: |
          ! git grep -nIE '(sk-[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[bap]-[A-Za-z0-9-]{10,})' -- . ':!*.lock'

  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  reader:
    name: Offline reader renderer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macos/reader-renderer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/reader-renderer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check generated resources
        run: git diff --exit-code -- ../Paperico/Resources/Reader

  macos:
    name: Native app (core tests + xcodebuild)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Developer tool regression tests
        run: python3 -m unittest discover -s macos/scripts/tests -p 'test_*.py'
      - name: Core regression tests
        run: swift test --package-path macos
      - name: Build
        run: |
          xcodebuild -project macos/Paperico.xcodeproj -scheme Paperico \
            -destination 'platform=macOS' \
            -derivedDataPath macos/build/DerivedData-CI build \
            CODE_SIGNING_ALLOWED=NO
